name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::SIGNING_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Tests, lint and release build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Version
        id: v
        run: |
          NAME=$(sed -n "s/^ *versionName '\(.*\)'/\1/p" app/build.gradle)
          CODE=$(sed -n 's/^ *versionCode \([0-9]*\)/\1/p' app/build.gradle)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$NAME" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match versionName $NAME"; exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          APK="tvlauncher-$NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/$APK" | grep -E 'SHA-256' | head -1
          ( cd "$RUNNER_TEMP" && sha256sum "$APK" > "$APK.sha256" )
          echo "apk=$RUNNER_TEMP/$APK" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.v.outputs.apk }}" "${{ steps.v.outputs.apk }}.sha256" \
            --title "tvlauncher ${{ steps.v.outputs.name }}" \
            --notes "versionName ${{ steps.v.outputs.name }}, versionCode ${{ steps.v.outputs.code }}. Signed with the release key."

      - name: Build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: tvlauncher-${{ steps.v.outputs.name }}
          path: ${{ steps.v.outputs.apk }}
